[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egisso-to-ecp"
version = "0.1.0"
description = "Production-grade tool to migrate historical social welfare data from EGISSO to GIS ECP format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artemii Denisov" }
]
dependencies = [
    "pydantic>=2.7.0",
    "python-calamine>=0.2.0",
    "openpyxl>=3.1.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PySide6-Essentials>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.6.0",
]

[project.scripts]
egisso-to-ecp = "egisso_to_ecp.presentation.cli.main:app"
egisso-to-ecp-gui = "egisso_to_ecp.presentation.gui.main:run_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/egisso_to_ecp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "python_calamine.*",
    "PySide6.*",
    "typer.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

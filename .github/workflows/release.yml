name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone Executable & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Create virtual environment
        run: uv venv --python 3.13

      - name: Install project and build dependencies
        run: uv pip install -e ".[dev]"

      - name: Run automated test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build Windows Standalone Executables
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/build_exe.py

      - name: Create ZIP archive for distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist/EGISSO_to_ECP.exe, dist/LICENSE.txt -DestinationPath dist/EGISSO_to_ECP_Windows.zip

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: "EGISSO to GIS ECP Converter ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/EGISSO_to_ECP.exe
            dist/EGISSO_to_ECP_Windows.zip
            dist/LICENSE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
